<!DOCTYPE html>
<html>
<head>
    <title>SCADA System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background-color: #0b0f14;
            color: #e6edf3;
        }
        header {
            padding: 15px;
            background: #121821;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        header h1 { font-size: 18px; margin: 0; }

        .status-indicator {
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            background: #374151;
        }
        .status-on { background: #16a34a; }
        .status-off { background: #dc2626; }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }
        .card {
            background: #111827;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }
        .station {
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            background: #1f2937;
        }
        .fault  { border-left: 5px solid #dc2626; }
        .normal { border-left: 5px solid #16a34a; }

        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .on-btn  { background: #16a34a; color: white; }
        .off-btn { background: #dc2626; color: white; }

        .chart-wrap {
            position: relative;
            height: 280px;
            width: 100%;
        }
        canvas {
            background: #0b0f14;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<header>
    <h1>SCADA Monitoring System</h1>
    <div id="statusBox" class="status-indicator status-off">OFF</div>
</header>

<div class="container">
    <div class="card">
        <h2>Stations</h2>
        <div id="stations"></div>
        <button class="on-btn"  onclick="controlSystem('ON')">Start</button>
        <button class="off-btn" onclick="controlSystem('OFF')">Stop</button>
    </div>

    <div class="card">
        <h2>Voltage Trend (Station A)</h2>
        <div class="chart-wrap">
            <canvas id="chart"></canvas>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
